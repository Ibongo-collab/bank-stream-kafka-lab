server:
  port: 8082

spring:
  application:
    name: balance-consumer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: balance-consumer

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bankstream: INFO
