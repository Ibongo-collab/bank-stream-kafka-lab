name: bankstream-kafka-lab

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: bsk-kafka
    ports:
      - "9092:9092"       # accessible depuis ta machine (hors Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Kafka UI : voir les topics, partitions, messages, consumer groups
  #     et leurs offsets — http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bsk-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bankstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  transaction-producer:
    build:
      context: .
      dockerfile: transaction-producer/Dockerfile
    container_name: bsk-transaction-producer
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  balance-consumer:
    build:
      context: .
      dockerfile: balance-consumer/Dockerfile
    container_name: bsk-balance-consumer
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  fraud-watcher:
    build:
      context: .
      dockerfile: fraud-watcher/Dockerfile
    container_name: bsk-fraud-watcher
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Prometheus : interroge périodiquement (scrape) l'endpoint
  #     /actuator/prometheus de chaque service (exposé via Micrometer,
  #     déjà présent dans les 3 pom.xml) et stocke les métriques dans le
  #     temps — http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: bsk-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - transaction-producer
      - balance-consumer
      - fraud-watcher

  # --- Grafana : dashboards construits sur les données de Prometheus
  #     (déjà pré-connecté en datasource) — http://localhost:3000
  #     identifiants par défaut : admin / admin
  grafana:
    image: grafana/grafana:latest
    container_name: bsk-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus