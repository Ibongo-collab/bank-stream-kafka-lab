server:
  port: 8083

spring:
  application:
    name: fraud-watcher
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-watcher
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.bankstream.fraudwatcher.infrastructure.adapter.in.messaging
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.bankstream.fraudwatcher.infrastructure.adapter.in.messaging.TransactionEvent

app:
  kafka:
    topic:
      transactions: transactions

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: fraud-watcher

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Thresholds for the domain fraud rules — bound to FraudRulesProperties and
# handed to the (plain Java, framework-free) rule objects in
# FraudRulesConfiguration. Tune these without touching any Java code.
fraud:
  rules:
    high-amount-threshold: 1000000
    velocity-max-count: 5
    velocity-window-seconds: 60

logging:
  level:
    com.bankstream: INFO